<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>verify up</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--header-h:66px;--sb-w:196px;--saffron:#E65100;--saffron2:#FF8F00;--green:#1B5E20;--navy:#0D1B6E;--bg:#F7F5F2;--card:#FFFFFF;--border:#E5E0D8;--text:#1A1A1A;--muted:#666;--muted2:#999}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
#loader{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 30%,#1a0c14 0%,#0b0510 55%,#060308 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Rajdhani',sans-serif;transition:opacity .6s ease,transform .6s ease}
#loader.hiding{opacity:0;transform:scale(1.04);pointer-events:none}
#loader::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(230,81,0,.18) 0%,transparent 65%),radial-gradient(ellipse 40% 40% at 20% 80%,rgba(27,94,32,.12) 0%,transparent 55%);animation:bgPulse 3.5s ease-in-out infinite alternate}
@keyframes bgPulse{from{opacity:.6}to{opacity:1}}
#loader::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,143,0,.25) 1px,transparent 1px);background-size:48px 48px;animation:float 12s linear infinite;opacity:.3}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-48px)}}
.splash-tricolor{position:absolute;top:0;left:0;right:0;height:5px;display:flex;z-index:3}
.stc1{flex:1;background:#FF6D00}.stc2{flex:1;background:#fff;opacity:.85}.stc3{flex:1;background:#138808}
.splash-corner{position:absolute;width:48px;height:48px;z-index:3;opacity:.2}
.sc-tl{top:16px;left:16px;border-top:2px solid #FF6D00;border-left:2px solid #FF6D00;border-radius:4px 0 0 0}
.sc-tr{top:16px;right:16px;border-top:2px solid #FF6D00;border-right:2px solid #FF6D00;border-radius:0 4px 0 0}
.sc-bl{bottom:16px;left:16px;border-bottom:2px solid #FF6D00;border-left:2px solid #FF6D00;border-radius:0 0 0 4px}
.sc-br{bottom:16px;right:16px;border-bottom:2px solid #FF6D00;border-right:2px solid #FF6D00;border-radius:0 0 4px 0}
.splash-map{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;animation:mapIn 1.2s ease .15s forwards}@keyframes mapIn{to{opacity:.55}}.splash-map svg{width:min(74vh,90vw);height:auto;filter:drop-shadow(0 0 16px rgba(255,140,0,.4))}.splash-map path{fill:rgba(255,140,0,.045);stroke:rgba(255,165,70,.34);stroke-width:.22;stroke-linejoin:round}.splash-map .dot{fill:#FF9320;filter:drop-shadow(0 0 1.1px rgba(255,185,90,.95));animation:dotPulse 2.6s ease-in-out infinite}@keyframes dotPulse{0%,100%{opacity:.28;r:.45}50%{opacity:1;r:1.05}}.splash-chakra-wrap{position:relative;width:110px;height:110px;margin-bottom:22px;z-index:2;animation:floatUD 3.2s ease-in-out infinite}
@keyframes floatUD{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.splash-chakra-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,143,0,.42) 0%,transparent 68%);animation:glowPulse 2.4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.22);opacity:1}}
.splash-chakra-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,153,0,.5);animation:spin 6s linear infinite}
.splash-chakra-ring2{position:absolute;inset:8px;border-radius:50%;border:1.5px dashed rgba(0,100,200,.3);animation:spin 4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.chakra-svg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.splash-eyebrow{position:relative;z-index:2;font-size:9.5px;letter-spacing:5px;color:rgba(255,153,0,.55);text-transform:uppercase;margin-bottom:5px;text-align:center;animation:revealUp .7s cubic-bezier(.34,1.56,.64,1) .1s both}
.splash-main-title{position:relative;z-index:2;font-size:clamp(22px,4.5vw,40px);font-weight:700;letter-spacing:4px;text-transform:uppercase;text-align:center;line-height:1.1;margin-bottom:4px;animation:revealUp .75s cubic-bezier(.34,1.56,.64,1) .2s both}
.splash-saffron{background:linear-gradient(90deg,#FF9800 0%,#E65100 50%,#FF6D00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-white{color:rgba(255,255,255,.88)}
.splash-x-row{position:relative;z-index:2;display:flex;align-items:center;gap:10px;margin-bottom:5px;animation:revealUp .75s cubic-bezier(.34,1.56,.64,1) .3s both}
.splash-x-icon{width:28px;height:28px;background:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.splash-x-label{font-size:clamp(12px,2vw,17px);font-weight:700;letter-spacing:6px;color:rgba(255,255,255,.75);text-transform:uppercase}
.splash-subtitle{position:relative;z-index:2;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:4px;text-align:center;animation:revealUp .7s .4s both}
.splash-hindi{position:relative;z-index:2;font-family:'Tiro Devanagari Hindi',serif;font-size:15px;color:rgba(255,180,80,.65);margin-bottom:26px;text-align:center;animation:revealUp .7s .45s both}
@keyframes revealUp{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.splash-stats{position:relative;z-index:2;display:flex;gap:0;margin-bottom:18px;border:1px solid rgba(230,81,0,.22);border-radius:10px;overflow:hidden;backdrop-filter:blur(10px);background:rgba(255,255,255,.025);animation:revealUp .7s .55s both}
.splash-stat{padding:12px 18px;text-align:center;border-right:1px solid rgba(230,81,0,.15);min-width:84px}
.splash-stat:last-child{border-right:none}
.splash-stat-val{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;line-height:1;background:linear-gradient(135deg,#FF9800,#E65100);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.splash-stat-lbl{font-size:8px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
.splash-progress-wrap{position:relative;z-index:2;width:min(340px,75vw);animation:revealUp .6s .75s both}
.splash-progress-track{height:2.5px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-bottom:8px}
.splash-progress-fill{height:100%;border-radius:2px;width:0%;background:linear-gradient(90deg,#E65100,#FF9800,#FFD54F,#FF9800,#E65100);background-size:300% 100%;animation:progressGo 2.4s cubic-bezier(.4,0,.2,1) .4s forwards,shimmer 1.8s linear .4s infinite}
@keyframes progressGo{from{width:0%}to{width:100%}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.splash-status{text-align:center;font-size:9.5px;color:rgba(255,255,255,.28);letter-spacing:2.5px;text-transform:uppercase}
.splash-tagline{position:absolute;bottom:18px;z-index:2;font-size:9px;color:rgba(255,255,255,.14);letter-spacing:3px;text-transform:uppercase}
header{background:linear-gradient(90deg,#fff1df 0%,#fff6ec 60%,#fff3e4 100%);border-bottom:1.5px solid #f2ddc6;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:500;box-shadow:0 2px 14px rgba(0,0,0,.06);overflow:hidden}
/* ===== hdr-layout (09-Oct) =====
   Header ab FIXED hai -- scroll par, aur sidebar khulne/band hone par bhi
   bilkul nahi hilta. Uski asli unchai JS naap kar --header-h me daal deta
   hai; sidebar ka top aur main ka padding-top usi se bante hain, isliye
   kabhi overlap nahi hota. */
.hdr-burger{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;
  margin-right:2px;border:1px solid rgba(255,255,255,.35);border-radius:9px;background:rgba(255,255,255,.18);
  color:#fff;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.hdr-burger:hover{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.6)}
.hdr-burger:active{transform:scale(.94)}
.hdr-burger:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hdr-burger svg{display:block}
.logo{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.hdr-wh{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.smt-emblem{flex-shrink:0;border-radius:50%;filter:drop-shadow(0 3px 8px rgba(230,81,0,.4));transition:.25s}
.smt-emblem:hover{transform:rotate(-4deg) scale(1.05)}
.smt-emblem svg{display:block}
.smt-wordmark{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;line-height:1.1;margin-bottom:2px;background:linear-gradient(90deg,#FFB300 0%,#FF8F00 45%,#E65100 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-x-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(230,81,0,.3)}
.logo-text{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:#fff;line-height:1.1;text-shadow:0 1px 4px rgba(120,45,0,.45)}
.logo-sub{font-size:10px;color:rgba(255,255,255,.94);font-weight:600;text-shadow:0 1px 3px rgba(120,45,0,.4)}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:2}
.data-pill{font-size:11px;color:#8a5a2f;background:rgba(255,255,255,.75);border:1px solid #f0d6b8;border-radius:7px;padding:4px 10px;white-space:nowrap}
.download-btn{display:flex;align-items:center;gap:5px;padding:7px 15px;background:linear-gradient(135deg,#E65100,#FF8F00);border:none;border-radius:20px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 3px 10px rgba(230,81,0,.35);transition:.2s;white-space:nowrap}
.download-btn:hover{transform:translateY(-1px)}
.sidebar{position:fixed;left:0;top:var(--header-h);bottom:0;width:var(--sb-w);background:linear-gradient(180deg,rgba(255,252,247,.74) 0%,rgba(255,247,237,.67) 55%,rgba(255,240,225,.72) 100%);backdrop-filter:blur(22px) saturate(1.75);-webkit-backdrop-filter:blur(22px) saturate(1.75);box-shadow:0 2px 16px rgba(120,70,20,.06);border-right:none;display:flex;flex-direction:column;z-index:300;overflow:hidden;transform:translateX(-100%);transition:transform .26s ease}.sidebar.show{transform:translateX(0)}.sb-trigger svg{stroke:#fff}
.sidebar::-webkit-scrollbar{width:0}
.main-nav::-webkit-scrollbar{width:0}

.sb-emblem{width:44px;height:44px;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;flex:none;filter:drop-shadow(0 2px 4px rgba(120,40,0,.35))}
.sb-title{color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;line-height:1.04;letter-spacing:.3px;text-shadow:0 1px 4px rgba(120,45,0,.45)}
.sb-sub{color:rgba(255,255,255,.92);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;margin-top:5px;text-shadow:0 1px 3px rgba(120,45,0,.4)}
.main-nav{background:transparent;border:none;box-shadow:none;display:flex;flex-direction:column;gap:3px;padding:6px 12px 10px;position:relative;z-index:3;margin-top:14px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.mnav-tab{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:#3a3f4a;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;transition:.16s;letter-spacing:.2px}
.mnav-tab svg{width:18px;height:18px;flex:none;opacity:.92}
.mnav-tab:hover{color:#C2410C;background:rgba(230,81,0,.10)}
.mnav-tab.active{background:linear-gradient(135deg,#FF7A18,#E65100);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(230,81,0,.32)}
.mnav-tab.active svg{opacity:1}body.sb-open .sidebar{transform:translateX(0)}/* hdr-layout: ab content ko main ka padding khiskata hai, margin-left nahi */

.sb-lotus{margin-top:auto;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding:8px 0 18px}
.sb-lotus .ln{width:54%;height:1px;margin-bottom:10px;background:linear-gradient(90deg,transparent,rgba(194,65,12,.5),transparent)}
.sb-lotus svg.lo{width:82px;height:60px}
.sb-lotus .bh{font-size:8px;font-weight:800;letter-spacing:.4px;color:#B23A00;margin-top:6px;text-align:center;padding:0 6px;line-height:1.3}
.home-r1{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.home-r2{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}.home-r4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}@media(max-width:1100px){.home-r4{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.home-r1,.home-r2{grid-template-columns:1fr}}.theme-toggle{display:none !important;position:fixed;right:18px;bottom:18px;z-index:260;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:30px;padding:9px 15px;cursor:pointer;color:var(--text);font-size:12px;font-weight:600;box-shadow:0 5px 16px rgba(0,0,0,.16)}.theme-toggle:hover{border-color:#E65100;color:#E65100}.theme-toggle svg{width:15px;height:15px}body.dark{--bg:#0d1117;--card:#161b22;--border:#283039;--text:#e6edf3;--muted:#9aa4b2;--muted2:#6b7480}body.dark header{background:#161b22;border-bottom-color:#283039}body.dark .chart-ttl,body.dark .sec-title{color:#aeb9c4}body.dark .chart-sub-note{background:#1c2530;border-left-color:#1DA1F2;color:#9aa4b2}body.dark .data-pill{background:#1c2530;color:#9aa4b2}body.dark .logo-text{color:#e6edf3}body.dark .cm-table thead th{background:#1c2530}body.dark .cm-tile,body.dark .pf-card,body.dark .sum-card{background:#161b22}body.dark .lv-card .lv-sub,body.dark .kpi-sub{color:#8b95a1}
header{margin-left:0}
.page-section{margin-left:0}
@media(max-width:760px){header,.page-section{margin-left:0}}
.tab-bar{background:#fff;border-bottom:2px solid var(--border);padding:0 24px;display:flex;overflow-x:auto;gap:2px}
.ptab{display:flex;align-items:center;gap:7px;padding:10px 16px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:.15s;white-space:nowrap;user-select:none}
.ptab:hover{color:var(--text);background:#fafaf8}
.ptab.active{color:var(--text);border-bottom-color:var(--tc)}
.tbadge{font-size:9.5px;background:#0001;border-radius:10px;padding:1px 6px;color:var(--muted)}
.ptab-logo{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.ptab-all{--tc:#333}.ptab-bjp{--tc:#E65100}.ptab-inc{--tc:#0D47A1}.ptab-sp{--tc:#006400}
.ptab-dmk{--tc:#C62828}.ptab-aap{--tc:#1565C0}.ptab-other{--tc:#607d8b}
.page-section{display:none}
.page-section.active{display:block}
main{padding:16px 24px;max-width:1600px;margin:0 auto}
/* ===== hdr-offset (09-Oct) =====
   Header FIXED hai, isliye page ko uski unchai jitna neeche se shuru karna
   padta hai. Ye faasla PAGE-SECTION par lagta hai, sirf <main> par nahi --
   kyunki kuch tab (Parties, Reports, Tweet Intelligence, Handles To Be
   Added) ka filter-bar <main> se BAHAR, uske upar hota hai. Pehle offset
   sirf main par tha, isliye wo filter header ke peeche chhup jaate the. */
.page-section{padding-top:var(--header-h);transition:padding-left .25s ease}
body.sb-open .page-section{padding-left:var(--sb-w)}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
#dashKpis{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;border-left:4px solid var(--ka);box-shadow:0 1px 8px rgba(0,0,0,.04);transition:.2s;cursor:default}
.kpi:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.kpi-val{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;color:var(--ka);letter-spacing:-.5px}
.kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
.kpi-sub{font-size:10px;color:var(--muted2);margin-top:3px}
.sec-title{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.party-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.pcard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;border-top:4px solid var(--pc);transition:.2s;cursor:pointer;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.pcard:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-3px)}
.pcard.active-party{box-shadow:0 0 0 2.5px var(--pc),0 8px 24px rgba(0,0,0,.12);transform:translateY(-2px)}
.pc-bjp{--pc:#E65100}.pc-inc{--pc:#0D47A1}.pc-sp{--pc:#006400}
.pc-dmk{--pc:#C62828}.pc-aap{--pc:#1565C0}.pc-other{--pc:#607d8b}.pc-bsp{--pc:#22409A}.pc-rld{--pc:#007A3D}
.pcard-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pcard-logo{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.15);border:2px solid rgba(255,255,255,.7)}
.pcard-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pcard-name{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;color:var(--pc);line-height:1}
.pcard-full{font-size:9.5px;color:var(--muted);margin-top:2px}
.pcard-handles{font-size:10px;color:var(--pc);font-weight:600;margin-top:2px}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.pstat{background:#f8f6f2;border-radius:8px;padding:8px 10px;border:1px solid var(--border)}
.pstat-val{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;color:var(--pc)}
.pstat-lbl{font-size:9px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.5px}
.psent-section{margin-top:8px;padding:8px 10px;background:#f8f6f2;border-radius:8px;border:1px solid var(--border)}
.psent-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.psent-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.psent-row:last-child{margin-bottom:0}
.psent-lbl{font-size:9px;font-weight:700;width:22px;flex-shrink:0}
.psent-track{flex:1;height:5px;background:#ddd8d0;border-radius:3px;overflow:hidden}
.psent-fill{height:100%;border-radius:3px;width:0;transition:width 1.4s ease}
.pf-neu{background:#FF8F00}.pf-pos{background:#2E7D32}.pf-neg{background:#C62828}
.pl-pos{color:#1B5E20}.pl-neu{color:#E65100}.pl-neg{color:#C62828}
.psent-cnt{font-size:9px;color:var(--muted);width:42px;text-align:right;flex-shrink:0}
.pcard-click-hint{font-size:8px;color:var(--pc);opacity:.6;text-align:right;margin-top:6px;letter-spacing:.5px}
.level-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.lv-card{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;border-left:4px solid var(--lc);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.lv-val{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--lc)}
.lv-lbl{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.lv-sub{font-size:10px;color:var(--muted2);margin-top:2px}
.charts-2col{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:16px}
.chart-box{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 8px rgba(0,0,0,.04)}

/* ===== header-anim (10-Oct) : swoosh wave + logo coin flip =====
   Design me kuch nahi badla -- sirf do animation add hui hain.
   Saari timing in 5 variables se chalti hai, aur kahin number nahi likha. */
:root{
  --swoosh-intro-duration:1.5s;   /* page khulte hi wave andar aane ka samay */
  --swoosh-idle-duration:8s;      /* uske baad ki halki drift ka ek chakkar  */
  --swoosh-shimmer-duration:7s;   /* golden line par chalti chamak           */
  --logo-flip-duration:.9s;       /* logo ka coin flip                       */
  --hdr-fade-duration:.65s;       /* title/chips ka fade-in                  */
}
/* -- intro: wave baayein se andar -- */
.wh-intro{transform-box:view-box;transform-origin:0 80px;
  animation:whIntro var(--swoosh-intro-duration) cubic-bezier(.16,1,.3,1) both}
@keyframes whIntro{from{transform:translateX(-820px)}to{transform:translateX(0)}}
/* -- idle: bahut halki, dhimi drift -- */
.wh-drift{transform-box:view-box;transform-origin:0 80px;
  animation:whDrift var(--swoosh-idle-duration) ease-in-out var(--swoosh-intro-duration) infinite}
@keyframes whDrift{0%,100%{transform:translate(0,0) scaleY(1)}50%{transform:translate(6px,0) scaleY(1.014)}}
/* -- golden line par chalti chamak: window chalti hai, andar ka stroke utna
      hi ulta -> net motion zero, sirf transform, koi repaint nahi -- */
.wh-shim-win{transform-box:view-box;
  animation:whShimWin var(--swoosh-shimmer-duration) linear var(--swoosh-intro-duration) infinite}
.wh-shim-in{transform-box:view-box;
  animation:whShimIn var(--swoosh-shimmer-duration) linear var(--swoosh-intro-duration) infinite}
@keyframes whShimWin{0%,14%{transform:translateX(-210px)}100%{transform:translateX(1040px)}}
@keyframes whShimIn{0%,14%{transform:translateX(210px)}100%{transform:translateX(-1040px)}}
/* -- header ke text/chips ka halka fade-in -- */
.hdr-fade{animation:hdrFade var(--hdr-fade-duration) ease-out both;
  animation-delay:calc(var(--swoosh-intro-duration) * .5 + var(--d,0s))}
.hdr-right .hp-wrap{animation:hdrFade var(--hdr-fade-duration) ease-out both;
  animation-delay:calc(var(--swoosh-intro-duration) * .5 + .32s)}
@keyframes hdrFade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
/* -- logo coin flip -- */
.logo-coin{cursor:pointer;perspective:620px;-webkit-tap-highlight-color:transparent}
.logo-coin:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:50%}
.logo-coin .coin-inner{border-radius:50%;transform-style:preserve-3d;will-change:transform}
.logo-coin.flipping .coin-inner{animation:coinFlip var(--logo-flip-duration) cubic-bezier(.45,.05,.3,1)}
@keyframes coinFlip{0%{transform:rotateY(0deg) scale(1)}50%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(360deg) scale(1)}}
.logo-coin.flipping:hover{transform:none}   /* flip ke waqt hover-tilt band */
/* -- PDF/report capture ke waqt sab freeze: image me wave hamesha apni
      asli jagah par aaye -- */
header.hdr-capturing .wh-intro,header.hdr-capturing .wh-drift,
header.hdr-capturing .wh-shim-win,header.hdr-capturing .wh-shim-in,
header.hdr-capturing .hdr-fade,header.hdr-capturing .hp-wrap{
  animation:none !important;transform:none !important;opacity:1 !important}
/* -- splash-gate: animation tab tak ruki rehti hai jab tak loader hat na
      jaye. Warna intro loader ke PEECHE chal kar khatam ho jaati thi aur
      user ko dikhti hi nahi thi. body.hdr-go lagte hi chalu. -- */
.wh-intro,.wh-drift,.wh-shim-win,.wh-shim-in,.hdr-fade,.hdr-right .hp-wrap{
  animation-play-state:paused}
body.hdr-go .wh-intro,body.hdr-go .wh-drift,body.hdr-go .wh-shim-win,
body.hdr-go .wh-shim-in,body.hdr-go .hdr-fade,body.hdr-go .hdr-right .hp-wrap{
  animation-play-state:running}
/* -- jinhe motion nahi chahiye -- */
@media (prefers-reduced-motion: reduce){
  .wh-intro,.wh-drift,.wh-shim-win,.wh-shim-in{animation:none !important;transform:none !important}
  .wh-shim-win{display:none}
  .hdr-fade,.hdr-right .hp-wrap{animation:none !important;opacity:1 !important;transform:none !important}
  .logo-coin.flipping .coin-inner{animation:coinPop .25s ease both}
  @keyframes coinPop{0%{opacity:.45}100%{opacity:1}}
}

.state-path{

  paint-order: stroke fill;
  transition:filter .18s;
  vector-effect: non-scaling-stroke;
}
.state-path:hover{filter:brightness(0.80) saturate(1.4)}

/* ---- HANDLE ANALYTICS (ha v2) ---- */
.ha-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:14px}
.ha-stitle{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  font-weight:700;margin-bottom:12px}
.ha-stitle span{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;margin-left:6px}
.ha-controls{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.ha-cg{display:flex;flex-direction:column;gap:6px}
.ha-cg label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ha-cg input,.ha-cg select{background:var(--card);border:1.5px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:8px;font-size:12.5px;outline:none;font-family:inherit;min-width:150px}
.ha-cg input:focus,.ha-cg select:focus{border-color:#E65100}

/* ---- profile hero (aapke diye HTML jaisa bada banner) ---- */
.ha-hero{border:1.5px solid var(--border);border-radius:12px;overflow:hidden;
  background:var(--card);margin-bottom:14px}
.ha-banner{position:relative;overflow:hidden;min-height:230px;padding:26px 30px;
  display:flex;gap:26px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(135deg,#F59320,#FFC266)}
.ha-banner > *:not(.ha-coverimg){position:relative;z-index:1}
.ha-coverimg{position:absolute;top:0;right:0;height:100%;aspect-ratio:3/1;max-width:100%;
  display:none;background-size:cover;background-position:center;background-repeat:no-repeat}
.ha-banner.has-cover{background:#E65100}
.ha-banner.has-cover .ha-coverimg{display:block}
.ha-coverimg::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to right,#E65100 0%,rgba(230,81,0,.35) 45%,transparent 70%)}
/* ---- xlive-front : refresh button + live chip ---- */
.ha-refresh{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;
  border-radius:50%;border:0;cursor:pointer;background:rgba(0,0,0,.42);color:#fff;
  font-size:16px;line-height:32px;text-align:center;padding:0;
  transition:background .15s,transform .4s}
.ha-refresh:hover{background:rgba(0,0,0,.65)}
.ha-refresh.spin{animation:haspin .8s linear infinite}
@keyframes haspin{to{transform:rotate(360deg)}}
.ha-live{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:800;letter-spacing:.4px;vertical-align:middle;
  background:rgba(255,255,255,.22);color:#fff}
.ha-live.old{background:rgba(0,0,0,.28)}
.ha-av{width:140px;height:140px;border-radius:50%;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:44px;color:#fff;background:rgba(255,255,255,.3);border:3px solid rgba(255,255,255,.75);
  background-size:cover;background-position:center top;overflow:hidden}
.ha-who{flex:1;min-width:220px}
.ha-name{font-weight:800;font-size:25px;color:#2a1400;line-height:1.15}
.ha-handle{color:rgba(42,20,0,.68);font-size:16px;margin-bottom:8px}
.ha-chips{display:flex;gap:6px;flex-wrap:wrap}
.ha-chips span{background:rgba(255,255,255,.65);color:#2a1400;border-radius:20px;
  padding:3px 11px;font-size:10.5px;font-weight:700}
.ha-bio{color:#2a1400;font-size:12.5px;max-width:460px;line-height:1.55;margin:10px 0 0}

/* ---- kpi-tiles : KPI tiles ----------------------------------
   Pehle poore grid ka background border-colour tha aur gap:1px se lakeerein
   banti theen -- isliye aakhri line ki khaali jagah ek bhari hui patti
   jaisi dikhti thi. Ab har tile apna card hai aur container khaali. */
.ha-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:10px;padding:14px 16px 16px;background:transparent;
  border-top:1px solid var(--border)}
.ha-cells .c{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;min-width:0;position:relative;overflow:hidden;
  transition:border-color .15s,box-shadow .15s}
.ha-cells .c::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,#E65100);opacity:.85}
.ha-cells .c:hover{border-color:var(--accent,#E65100);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.ha-cells .v{font-family:'Rajdhani',sans-serif;font-size:23px;font-weight:700;
  line-height:1.15;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ha-cells .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.4px;margin-top:4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
@media(max-width:560px){
  .ha-cells{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;padding:12px}
  .ha-cells .v{font-size:19px}
}
.ha-note{padding:9px 16px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);
  background:#FBF6F1;display:none}
.ha-note.on{display:block}

.ha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ha-chart{border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;background:var(--card)}
.ha-ct{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.ha-cb{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;margin-top:5px}
.ha-cb small{font-size:10.5px;font-weight:400;color:var(--muted);margin-left:4px}
.ha-cempty{color:var(--muted);font-size:11px;padding:28px 0;text-align:center}
.ha-msg{color:var(--muted);font-size:12px;padding:18px;text-align:center}
.ha-empty{text-align:center;padding:18px!important;color:var(--muted)}
.ha-toptext{font-size:13px;line-height:1.6;margin-bottom:12px}
.ha-inline{display:flex;gap:22px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.ha-inline b{color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px}
.ha-pg{display:flex;align-items:center;gap:9px;justify-content:flex-end;margin-top:12px;
  font-size:11.5px;color:var(--muted)}
.ha-pg button{cursor:pointer}
.ha-pg button:disabled{opacity:.4;cursor:default}
.ha-tt{max-width:400px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
@media(max-width:700px){
  .ha-banner{min-height:0;padding:20px}
  .ha-av{width:96px;height:96px;font-size:30px}
  .ha-name{font-size:20px}
  .ha-coverimg{opacity:.35}
}

/* -- intro tabhi chalao jab splash loader hatne lage -- */
(function () {
  var done = false;
  function go() {
    if (done) return;
    done = true;
    try { document.body.classList.add('hdr-go'); } catch (e) {}
  }
  var ld = document.getElementById('loader');
  if (!ld || ld.classList.contains('hiding') || ld.style.display === 'none') { go(); return; }
  try {
    var mo = new MutationObserver(function () {
      if (ld.classList.contains('hiding') || ld.style.display === 'none') { mo.disconnect(); go(); }
    });
    mo.observe(ld, { attributes: true, attributeFilter: ['class', 'style'] });
  } catch (e) { go(); return; }
  /* agar kisi wajah se loader kabhi na hate to bhi header dikhna chahiye */
  setTimeout(go, 7000);
})();

(function () {
  var el = document.getElementById('logoCoin');
  if (!el) return;
  var inner = el.querySelector('.coin-inner');
  if (!inner) return;
  function flip() {
    if (el.classList.contains('flipping')) return;   /* pehla flip abhi chal raha hai */
    el.classList.add('flipping');
  }
  inner.addEventListener('animationend', function () { el.classList.remove('flipping'); });
  el.addEventListener('click', flip);
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); flip(); }
  });
})();
