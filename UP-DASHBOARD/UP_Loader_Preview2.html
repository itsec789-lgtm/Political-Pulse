<!DOCTYPE html><html><head><meta charset="utf-8"><title>UP Loader Preview 2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
html,body{margin:0;height:100%;background:#000;font-family:'Rajdhani',sans-serif;overflow:hidden}
#loader{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1e0d14 0%,#0b0510 58%,#050307 100%)}
#loader::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,143,0,.18) 1px,transparent 1px);background-size:46px 46px;opacity:.25}
.tri{position:absolute;top:0;left:0;right:0;height:5px;display:flex;z-index:8}.tri i{flex:1}.s{background:#FF9933}.w{background:#fff}.g{background:#138808}
.mapwrap{position:absolute;inset:0 0 70px 0;display:flex;align-items:center;justify-content:center;z-index:1}
.mapwrap svg{width:min(94vh,96vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,140,0,.55));animation:mg 4s ease-in-out infinite alternate}
@keyframes mg{from{filter:drop-shadow(0 0 12px rgba(255,120,0,.4))}to{filter:drop-shadow(0 0 30px rgba(255,165,50,.75))}}
.upmap{fill:rgba(255,140,0,.09);stroke:rgba(255,180,85,.72);stroke-width:.32;stroke-linejoin:round}
.dot{fill:#FFC46A;filter:drop-shadow(0 0 4px rgba(255,190,100,.95));animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;r:.8}50%{opacity:1;r:1.5}}
.center{position:absolute;top:44%;left:0;right:0;transform:translateY(-50%);z-index:5;text-align:center}
.chakra{width:70px;height:70px;position:relative;margin:0 auto 16px}
.chakra .r1{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,175,80,.9);animation:spin 7s linear infinite}
.chakra .r2{position:absolute;inset:10px;border-radius:50%;border:1.4px dashed rgba(255,150,60,.6);animation:spin 10s linear infinite reverse}
.chakra .hub{position:absolute;top:50%;left:50%;width:11px;height:11px;border-radius:50%;background:#FF9320;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(255,160,80,.9)}
@keyframes spin{to{transform:rotate(360deg)}}
.eb{font-size:11px;letter-spacing:6px;color:rgba(255,190,130,.9);font-weight:600;margin-bottom:8px}
.ti{font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#FF9800,#E65100 50%,#FF6D00);-webkit-background-clip:text;background-clip:text;color:transparent}
.load{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.55);margin-top:10px}
.bottom{position:absolute;left:0;right:0;bottom:26px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:14px}
.stats{display:flex;gap:0;background:rgba(20,12,20,.5);border:1px solid rgba(255,170,80,.22);border-radius:14px;overflow:hidden;backdrop-filter:blur(5px)}
.stat{padding:12px 26px;text-align:center;border-right:1px solid rgba(255,170,80,.15)}
.stat:last-child{border-right:none}
.stat .v{font-size:22px;font-weight:700;color:#FFB65A;line-height:1}
.stat .l{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:5px}
.pbar{width:230px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#FF9800,#E65100);border-radius:3px;animation:pb 2s ease-in-out infinite}
@keyframes pb{0%{width:15%}50%{width:80%}100%{width:15%}}
</style></head><body>
